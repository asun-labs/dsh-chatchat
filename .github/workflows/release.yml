name: Build and release ChatChat

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to release from main (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chatchat-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("package.json")); const l=JSON.parse(fs.readFileSync("package-lock.json")); if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION) || m.version !== process.env.RELEASE_VERSION || l.version !== m.version || l.packages[""].version !== m.version) throw new Error("Release version mismatch");'
          test -f "docs/releases/${RELEASE_VERSION}.md"
      - name: Use the verified packaging toolchain
        run: npm install --global npm@11.21.3
      - run: npm ci
      - name: Install test browsers
        run: npx playwright install --with-deps chromium chrome
      - name: Run inherited regression tests
        run: npm test
      - name: Run integration and package tests
        run: npm run test:integration
      - name: Build precompiled release package
        run: |
          npm run pack:release
          cd dist
          sha256sum -c *.tgz.sha256
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatchat-package
          path: |
            dist/*.tgz
            dist/*.tgz.sha256
            dist/*.tgz.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chatchat-package
          path: dist
      - name: Publish immutable versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd dist
          sha256sum -c *.tgz.sha256
          cd ..
          gh release create "v${RELEASE_VERSION}" dist/*.tgz dist/*.tgz.sha256 dist/*.tgz.json \
            --target "$GITHUB_SHA" --title "DSH ChatChat v${RELEASE_VERSION}" \
            --notes-file "docs/releases/${RELEASE_VERSION}.md" --latest
